<title id="t">Cutefish at a glance</title>
<desc id="d">Tiers from applications down: Cutefish and other applications, the libraries, the desktop processes (the compositor with the shell inside it, the session and services, the file manager daemon, the display manager), system services and the kernel.</desc>
