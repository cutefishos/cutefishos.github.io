<rect class="sys" x="442.667" y="44" width="173.333" height="54" rx="9"/>
<text x="529.333" y="67" class="b" text-anchor="middle">libinput</text>
<text x="529.333" y="86" class="ms" text-anchor="middle">libseat session</text>
<rect class="cf" x="442.667" y="118" width="173.333" height="54" rx="9"/>
<text x="529.333" y="141" class="b" text-anchor="middle">InputManager</text>
<text x="529.333" y="160" class="ms" text-anchor="middle">input/</text>
<path class="lnb" d="M529.3333333333334 100 V114" marker-end="url(#ab)"/>
