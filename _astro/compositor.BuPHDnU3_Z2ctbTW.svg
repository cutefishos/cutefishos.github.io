<text x="480.667" y="350" class="ms">wl_seat</text>
<path class="lnb" d="M454.6666666666667 337 H464.6666666666667" marker-end="url(#ab)"/>
<rect class="card" x="468.667" y="366" width="147.333" height="42" rx="8"/>
<text x="480.667" y="384" class="b">Shell views</text>
