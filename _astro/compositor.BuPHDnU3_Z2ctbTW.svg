<path class="lnb" d="M529.3333333333334 174 V188" marker-end="url(#ab)"/>
<rect class="card" x="468.667" y="266" width="147.333" height="42" rx="8"/>
<text x="480.667" y="284" class="b">Shortcuts</text>
<text x="480.667" y="300" class="ms">accelerators/</text>
<path class="lnb" d="M454.6666666666667 287 H464.6666666666667" marker-end="url(#ab)"/>
