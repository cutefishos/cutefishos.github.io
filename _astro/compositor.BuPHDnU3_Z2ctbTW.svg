<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d">
<title id="t">Inside cutefish-compositor</title>
<desc id="d">Window state flows down from client resources through surfaces, roles and windows into the scene; frames flow up from the output scheduler, which decides when a frame begins, through damage, plane assignment and GLES composition of the rest to the KMS commit and the display; input flows from libinput through the seat to shortcuts, the focused client or the shell.</desc>
<style>
.bg{fill:#f6f7f9}
.card{fill:#ffffff;stroke:#dfe2e7;stroke-width:1}
.cf{fill:#ebf3ff;stroke:#a8c7fb;stroke-width:1}
.cfs{fill:#3385ff}
.cfband{fill:#d6e6ff}
.sys{fill:#eceef1;stroke:#dadde2;stroke-width:1}
.warm{fill:#fff3e2;stroke:#f2c27c;stroke-width:1}
.chip{fill:#ffffff;stroke:#d5d9df;stroke-width:1}
.chipb{fill:#ffffff;stroke:#b9d2fb;stroke-width:1}
text{font-family:system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;fill:#323238;font-size:14px}
.b{font-weight:600}
.s{fill:#686872;font-size:13px}
.xs{fill:#686872;font-size:12px}
.c{font-size:13px}
.cap{fill:#7b7b85;font-size:11.5px;font-weight:600;letter-spacing:.08em}
.m{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, monospace;font-size:13px}
.ms{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, monospace;font-size:12px;fill:#686872}
.on{fill:#ffffff;font-weight:600}
.ln{fill:none;stroke:#9aa0aa;stroke-width:1.5}
.lnb{fill:none;stroke:#3385ff;stroke-width:1.5}
.lnd{fill:none;stroke:#3385ff;stroke-width:1.5;stroke-dasharray:5 4}
.vb{fill:none;stroke:#c3c8d0;stroke-width:1;stroke-dasharray:3 4}
.ah{fill:#9aa0aa}
.ahb{fill:#3385ff}
.dot{fill:#3385ff}
@media (prefers-color-scheme: dark) {
.bg{fill:#1f1f21}
.card{fill:#2a2a2d;stroke:#3b3b40}
.cf{fill:#1b2a43;stroke:#2e5596}
.cfband{fill:#22375a}
.sys{fill:#28282b;stroke:#38383d}
.warm{fill:#382b19;stroke:#8a6228}
.chip{fill:#323236;stroke:#45454b}
.chipb{fill:#24324a;stroke:#35588f}
text{fill:#f0f0f3}
.s,.xs,.ms{fill:#a2a2ab}
.cap{fill:#8e8e97}
.on{fill:#ffffff}
.ln{stroke:#7a7f88}
.vb{stroke:#4a4a50}
.ah{fill:#7a7f88}
}
</style>
