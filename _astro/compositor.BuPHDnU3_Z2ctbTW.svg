<text x="54" y="500" class="xs">frame callbacks and presentation feedback go back to clients</text>
<text x="24" y="522" class="xs">Client DMA-BUFs go straight to a plane when the scene allows; everything</text>
<text x="24" y="539" class="xs">else is composed with GLES, repainting only the damage.</text>
