<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" width="640" height="606" role="img" aria-labelledby="t d">
<title id="t">cutefish-toolkit layers</title>
<desc id="d">Six layers from the base library up to controls, and three platforms: Wayland for applications, Embedded for the compositor, Headless for tests.</desc>
<style>
.bg{fill:#f6f7f9}
.card{fill:#ffffff;stroke:#dfe2e7;stroke-width:1}
.cf{fill:#ebf3ff;stroke:#a8c7fb;stroke-width:1}
.cfs{fill:#3385ff}
.cfband{fill:#d6e6ff}
.sys{fill:#eceef1;stroke:#dadde2;stroke-width:1}
.warm{fill:#fff3e2;stroke:#f2c27c;stroke-width:1}
.chip{fill:#ffffff;stroke:#d5d9df;stroke-width:1}
.chipb{fill:#ffffff;stroke:#b9d2fb;stroke-width:1}
text{font-family:system-ui, -apple-system, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;fill:#323238;font-size:14px}
.b{font-weight:600}
.s{fill:#686872;font-size:13px}
.xs{fill:#686872;font-size:12px}
.c{font-size:13px}
.cap{fill:#7b7b85;font-size:11.5px;font-weight:600;letter-spacing:.08em}
.m{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, monospace;font-size:13px}
.ms{font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, monospace;font-size:12px;fill:#686872}
.on{fill:#ffffff;font-weight:600}
.ln{fill:none;stroke:#9aa0aa;stroke-width:1.5}
.lnb{fill:none;stroke:#3385ff;stroke-width:1.5}
.lnd{fill:none;stroke:#3385ff;stroke-width:1.5;stroke-dasharray:5 4}
.vb{fill:none;stroke:#c3c8d0;stroke-width:1;stroke-dasharray:3 4}
.ah{fill:#9aa0aa}
.ahb{fill:#3385ff}
.dot{fill:#3385ff}
@media (prefers-color-scheme: dark) {
.bg{fill:#1f1f21}
.card{fill:#2a2a2d;stroke:#3b3b40}
.cf{fill:#1b2a43;stroke:#2e5596}
.cfband{fill:#22375a}
.sys{fill:#28282b;stroke:#38383d}
.warm{fill:#382b19;stroke:#8a6228}
.chip{fill:#323236;stroke:#45454b}
.chipb{fill:#24324a;stroke:#35588f}
text{fill:#f0f0f3}
.s,.xs,.ms{fill:#a2a2ab}
.cap{fill:#8e8e97}
.on{fill:#ffffff}
.ln{stroke:#7a7f88}
.vb{stroke:#4a4a50}
.ah{fill:#7a7f88}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="640" height="606"/>
<rect class="cf" x="128" y="24" width="488" height="54" rx="9"/>
<text x="144" y="47" class="b">Controls</text>
<text x="144" y="66" class="xs">Button, TabBar, Menu, ScrollView, DialogWindow, FileChooser</text>
<rect class="cf" x="128" y="86" width="488" height="54" rx="9"/>
<text x="144" y="109" class="b">Text</text>
<text x="144" y="128" class="xs">SkParagraph on HarfBuzz, ICU, FreeType; text-input-v3</text>
<rect class="cf" x="128" y="148" width="488" height="54" rx="9"/>
<text x="144" y="171" class="b">Views</text>
<text x="144" y="190" class="xs">retained tree, incremental layout, painter on device pixels</text>
<rect class="cf" x="128" y="210" width="488" height="54" rx="9"/>
<text x="144" y="233" class="b">GPU</text>
<text x="144" y="252" class="xs">Skia Ganesh on EGL and GLES; CPU raster when headless</text>
<rect class="cf" x="128" y="272" width="488" height="54" rx="9"/>
<text x="144" y="295" class="b">Platform</text>
<text x="144" y="314" class="xs">Wayland · Embedded · Headless</text>
<rect class="warm" x="128" y="334" width="488" height="54" rx="9"/>
<text x="144" y="357" class="b">Base</text>
<text x="144" y="376" class="xs">epoll loop, thread pool, sd-bus, files, settings, JSON</text>
<path class="ln" d="M118 26 H112 V324 H118"/>
<text x="104" y="179" class="ms" text-anchor="end">Toolkit</text>
<path class="ln" d="M118 336 H112 V386 H118"/>
<text x="104" y="365" class="ms" text-anchor="end">ToolkitBase</text>
<text x="24" y="424" class="cap">PLATFORMS</text>
<rect class="card" x="24" y="436" width="189.333" height="128" rx="10"/>
<text x="38" y="462" class="b">Wayland</text>
<text x="38" y="481" class="s">applications</text>
<text x="38" y="508" class="xs">xdg-shell window</text>
<text x="38" y="526" class="xs">EGL surface, frame-paced</text>
<text x="38" y="544" class="xs">fractional scale</text>
<rect class="card" x="225.333" y="436" width="189.333" height="128" rx="10"/>
<text x="239.333" y="462" class="b">Embedded</text>
<text x="239.333" y="481" class="s">the compositor</text>
<text x="239.333" y="508" class="xs">no connection of its own</text>
<text x="239.333" y="526" class="xs">draws into the</text>
<text x="239.333" y="544" class="xs">compositor's texture</text>
<rect class="card" x="426.667" y="436" width="189.333" height="128" rx="10"/>
<text x="440.667" y="462" class="b">Headless</text>
<text x="440.667" y="481" class="s">tests, captures</text>
<text x="440.667" y="508" class="xs">CPU raster to PNG</text>
<text x="440.667" y="526" class="xs">layout dump of views</text>
<text x="440.667" y="544" class="xs">scripted test input</text>
<text x="24" y="586" class="xs">One tree of views runs on all three.</text>
</svg>
